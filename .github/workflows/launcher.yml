name: Launcher

on:
  push:
    branches:
      - main
      - rhino-9.x
      - 'rhino-9.x/**'
    paths:
      - 'shared/router-launcher.mjs'
      - 'tests/launcher/**'
      - 'rhino/router/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    branches:
      - main
      - rhino-9.x
      - 'rhino-9.x/**'
    paths:
      - 'shared/router-launcher.mjs'
      - 'tests/launcher/**'
      - 'rhino/router/**'
      - '.github/workflows/launcher.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          # Ubuntu only runs the unsupported-platform test, so no router build.
          - os: ubuntu-latest
            rid: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup .NET
        if: matrix.rid != ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish router (${{ matrix.rid }})
        if: matrix.rid != ''
        shell: bash
        run: dotnet publish rhino/router/Router.csproj -c Release -r ${{ matrix.rid }} -o "$GITHUB_WORKSPACE/published-router"

      - name: Run launcher tests
        working-directory: tests/launcher
        shell: bash
        env:
          # Unset on ubuntu so the real-router integration test is skipped.
          RHINO_MCP_TEST_ROUTER_DIR: ${{ matrix.rid != '' && format('{0}/published-router', github.workspace) || '' }}
        run: node --test
