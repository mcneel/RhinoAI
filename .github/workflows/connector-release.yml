name: Connector Release

on:
  push:
    branches: [main]
    paths:
      - 'connector/**'
      - 'shared/router-launcher.mjs'
      - '.github/workflows/connector-release.yml'
  workflow_dispatch:

permissions:
  contents: write   # create tags + releases
  id-token: write   # OIDC auth for mcp-publisher

concurrency:
  group: connector-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: true
          fetch-depth: 1

      - name: Read connector version
        id: ver
        run: |
          VERSION=$(node -p "require('./connector/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=connector-v$VERSION" >> "$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} exists - nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version ${{ steps.ver.outputs.version }} - will release."
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate manifest
        if: steps.check.outputs.exists == 'false'
        working-directory: connector
        run: npx --yes @anthropic-ai/mcpb validate manifest.json

      - name: Pack .mcpb bundle
        if: steps.check.outputs.exists == 'false'
        working-directory: connector
        run: node build.mjs

      - name: Create GitHub Release (creates tag atomically)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            connector/*.mcpb \
            --title "Connector ${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            ${{ steps.ver.outputs.prerelease == 'true' && '--prerelease' || '' }}

      # --- Publish the npm launcher (widens client reach: VS Code, Cursor, Rider, etc.) ---

      - name: Check for npm token
        id: npmtok
        if: steps.check.outputs.exists == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret not set - skipping npm publish and omitting the npm entry from the registry."
          fi

      - name: Publish npm package
        if: steps.check.outputs.exists == 'false' && steps.npmtok.outputs.present == 'true'
        working-directory: mcp-registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          TAG_ARG=""
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && TAG_ARG="--tag next"
          npm publish --access public $TAG_ARG

      # --- Publish to the official MCP Registry (feeds github.com/mcp) ---

      - name: Install mcp-publisher
        if: steps.check.outputs.exists == 'false'
        working-directory: mcp-registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stamp server.json with release URL and hash
        if: steps.check.outputs.exists == 'false'
        working-directory: mcp-registry
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          NPM_PRESENT: ${{ steps.npmtok.outputs.present }}
        run: |
          HASH=$(openssl dgst -sha256 ../connector/connector.mcpb | awk '{print $2}')
          URL="https://github.com/${REPO}/releases/download/${TAG}/connector.mcpb"
          jq --arg v "$VERSION" --arg url "$URL" --arg hash "$HASH" '
            .version = $v
            | (.packages[] | select(.registryType == "mcpb") | .identifier) = $url
            | (.packages[] | select(.registryType == "mcpb") | .fileSha256) = $hash
            | (.packages[] | select(.registryType == "npm") | .version) = $v
          ' server.json > server.tmp && mv server.tmp server.json
          if [ "$NPM_PRESENT" != "true" ]; then
            jq 'del(.packages[] | select(.registryType == "npm"))' server.json > server.tmp && mv server.tmp server.json
            echo "npm not published this run - omitted the npm entry from server.json"
          fi
          cat server.json

      - name: Publish to MCP Registry
        if: steps.check.outputs.exists == 'false'
        working-directory: mcp-registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
