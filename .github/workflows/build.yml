name: Build

on:
  push:
    branches:
      - main
      - rhino-*
      - 'rhino-*/**'
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - rhino-*
      - 'rhino-*/**'
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build router
        run: dotnet build rhino/router/Router.csproj --configuration Release

      # tests/Integration.Tests is intentionally excluded
      - name: Test router
        run: dotnet test tests/Router.Tests/Router.Tests.csproj --configuration Release --verbosity normal

      - name: Test server
        run: dotnet test tests/Server.Tests/Server.Tests.csproj --configuration Release --verbosity normal

  plugin:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          # net48 is only a target when building on Windows, so the win plugin needs a Windows runner.
          - { os: win, runner: windows-latest }
          - { os: osx, runner: macos-latest }

    runs-on: ${{ matrix.plugin.runner }}
    needs: test

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Restore first so the generated NuGet props exist when the build evaluates.
      - name: Restore plugin
        shell: bash
        run: dotnet restore rhino/plugin/RhinoAI.csproj '-p:PluginOS=${{ matrix.plugin.os }}'

      - name: Build plugin (${{ matrix.plugin.os }})
        shell: bash
        run: dotnet build rhino/plugin/RhinoAI.csproj --configuration Release --no-restore '-p:PluginOS=${{ matrix.plugin.os }}'

      - name: Check net48 build
        if: matrix.plugin.os == 'win'
        shell: bash
        run: test -f net48/RhinoAI.rhp && test -f net8.0/RhinoAI.rhp
        working-directory: rhino/plugin/bin/${{ matrix.plugin.os }}/Release
